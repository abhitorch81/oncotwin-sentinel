name: OncoTwin CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m compileall -q backend/app
      - name: JavaScript syntax
        run: node --check frontend/assets/app.js
      - name: Shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Reject obvious committed secrets
        run: |
          if grep -RIE --exclude-dir=.git --exclude='*.glb' \
            '(AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .; then
            echo "Possible credential detected" >&2
            exit 1
          fi

  demo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test deterministic demo mode
        env:
          DEMO_MODE: "true"
        run: pytest -q
