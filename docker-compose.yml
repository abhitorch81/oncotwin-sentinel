services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["8000:8080"]
    env_file: .env
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:8080"]
    depends_on: [api]

